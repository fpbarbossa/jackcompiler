[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradutor_sintaxe_ufma"
version = "0.1.0"
description = "Projeto Python para tradutor sintaxe da UFMA"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "UFMA" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
tradutor-sintaxe-ufma = "tradutor_sintaxe_ufma.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
